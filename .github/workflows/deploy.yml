# One push to main deploys every server, one after another, stopping at the first failure:
#   1. checks  - syntax check + every self-check that needs no database (npm run check)
#   2. demo    - update the demo databases' schema, deploy the Cloudflare demo, check it serves this commit
#   3. client  - update the client database schema, deploy the client Worker (sbops.ahromlabs.com),
#                check it serves this commit. Needs CLIENT_DB_URL / CLIENT_DB_TOKEN in the "client" environment.
# A new customer server = one more job like `client`, needing the one before it.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN  Cloudflare API token with "Edit Cloudflare Workers" on the demo's account
#   DEMO_DB_TOKEN         Turso group token for the sbdemo group (golden + live demo databases)
#   DEMO_GOLDEN_URL       libsql:// URL of sb-demo-golden (the copy restored every night)
#   DEMO_DB_URL           libsql:// URL of sb-demo (what visitors use)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check

  demo:
    needs: checks
    runs-on: ubuntu-latest
    environment: demo
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Update demo database schema (golden first, then live)
        id: golden
        env:
          TURSO_AUTH_TOKEN: ${{ secrets.DEMO_DB_TOKEN }}
          GOLDEN: ${{ secrets.DEMO_GOLDEN_URL }}
          LIVE: ${{ secrets.DEMO_DB_URL }}
        run: |
          export CUSTOMER_SEED="$(cat scripts/demo/acme-seed.json)"
          node scripts/gen-migrate-fingerprint.mjs
          TURSO_URL="$GOLDEN" node scripts/migrate-db.mjs
          TURSO_URL="$LIVE" GITHUB_OUTPUT=/dev/null node scripts/migrate-db.mjs
      - name: Scan the demo data for the real client's details (only when it changed)
        if: steps.golden.outputs.changed == 'true'
        # Normally ~10 min; a hung network call once blocked every later deploy for an hour.
        timeout-minutes: 25
        env:
          DB_URL: ${{ secrets.DEMO_GOLDEN_URL }}
          DB_TOKEN: ${{ secrets.DEMO_DB_TOKEN }}
        run: node scripts/demo/scrub-check.mjs
      - name: Build and deploy the demo Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        # One retry: the build downloads Google fonts (next/font) and Google occasionally answers badly.
        run: npm run cf:deploy || (echo "retrying once" && sleep 20 && npm run cf:deploy)
      - name: Check the demo serves this commit
        run: node scripts/wait-for-commit.mjs https://boiler-erp.ahromlabs.com "$GITHUB_SHA" /demo

  client:
    needs: demo
    # The client's QC-only app on Cloudflare (sbops.ahromlabs.com, wrangler.client.jsonc). Skipped until the
    # CLIENT_DB_URL secret is set in the "client" environment.
    runs-on: ubuntu-latest
    environment: client
    env:
      HAS_CLIENT: ${{ secrets.CLIENT_DB_URL != '' }}
    steps:
      - uses: actions/checkout@v5
        if: env.HAS_CLIENT == 'true'
      - uses: actions/setup-node@v5
        if: env.HAS_CLIENT == 'true'
        with: { node-version: 22, cache: npm }
      - run: npm ci
        if: env.HAS_CLIENT == 'true'
      - name: Update the client database schema
        if: env.HAS_CLIENT == 'true'
        env:
          TURSO_URL: ${{ secrets.CLIENT_DB_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.CLIENT_DB_TOKEN }}
        run: |
          node scripts/gen-migrate-fingerprint.mjs
          GITHUB_OUTPUT=/dev/null node scripts/migrate-db.mjs
      - name: Build and deploy the client Worker
        if: env.HAS_CLIENT == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run cf:deploy:client || (echo "retrying once" && sleep 20 && npm run cf:deploy:client)
      - name: Check the client site serves this commit
        if: env.HAS_CLIENT == 'true'
        run: node scripts/wait-for-commit.mjs https://sbops.ahromlabs.com "$GITHUB_SHA" /login
