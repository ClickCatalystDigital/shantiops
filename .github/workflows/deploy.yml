# One push to main deploys every server, one after another, stopping at the first failure:
#   1. checks  - syntax check + every self-check that needs no database (npm run check)
#   2. demo    - update the demo databases' schema, deploy the Cloudflare demo, check it serves this commit
#   3. client  - trigger the client's Render deploy, wait until it serves this commit
# A new customer server = one more job like `client`, needing the one before it.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN  Cloudflare API token with "Edit Cloudflare Workers" on the demo's account
#   DEMO_DB_TOKEN         Turso group token for the sbdemo group (golden + live demo databases)
#   DEMO_GOLDEN_URL       libsql:// URL of sb-demo-golden (the copy restored every night)
#   DEMO_DB_URL           libsql:// URL of sb-demo (what visitors use)
#   RENDER_DEPLOY_HOOK    the client service's Deploy Hook URL (Render > Settings). With Render's
#                         Auto-Deploy turned off, the client is only deployed after the demo passed.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check

  demo:
    needs: checks
    runs-on: ubuntu-latest
    environment: demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Update demo database schema (golden first, then live)
        env:
          TURSO_AUTH_TOKEN: ${{ secrets.DEMO_DB_TOKEN }}
          GOLDEN: ${{ secrets.DEMO_GOLDEN_URL }}
          LIVE: ${{ secrets.DEMO_DB_URL }}
        run: |
          export CUSTOMER_SEED="$(cat scripts/demo/acme-seed.json)"
          TURSO_URL="$GOLDEN" node scripts/migrate-db.mjs
          TURSO_URL="$LIVE" node scripts/migrate-db.mjs
          DB_URL="$GOLDEN" DB_TOKEN="$TURSO_AUTH_TOKEN" node scripts/demo/scrub-check.mjs
      - name: Build and deploy the demo Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run cf:deploy
      - name: Check the demo serves this commit
        run: node scripts/wait-for-commit.mjs https://boiler-erp.ahromlabs.com "$GITHUB_SHA" /demo

  client:
    needs: demo
    runs-on: ubuntu-latest
    environment: client
    steps:
      - uses: actions/checkout@v4
      - name: Trigger the Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$HOOK" ]; then curl -fsS -X POST "$HOOK" > /dev/null && echo "deploy triggered"
          else echo "No RENDER_DEPLOY_HOOK: relying on Render's own auto-deploy"; fi
      - name: Wait until the client site serves this commit
        run: node scripts/wait-for-commit.mjs https://shantiops.onrender.com "$GITHUB_SHA" /login
